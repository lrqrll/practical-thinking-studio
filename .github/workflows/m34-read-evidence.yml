name: Read existing M3.4 failure evidence only
on:
  push:
    branches: [codex/nexus-m34-evidence]
    paths: [.github/workflows/m34-read-evidence.yml]
permissions:
  actions: read
  contents: write
jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: M34-visual-developer-evidence
          run-id: 40658910604
          github-token: ${{ github.token }}
          path: /tmp/m34-original
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil,json
          import hashlib
          root=Path('/tmp/m34-original');out=Path('diagnostic-evidence/final-c712bd6');out.mkdir(parents=True,exist_ok=True)
          names={'dashboard-390-light.png','dashboard-390-dark.png','dashboard-1440-light.png','dashboard-1440-dark.png'}
          manifest={}
          for f in root.rglob('*'):
            if f.is_file() and (f.name in ['m34-full.json','m34-selection.json','m34-https.json','m34-integrity.json','candidate-assets.json'] or ('m34-https-results' in str(f) and f.name in names)):
              shutil.copyfile(f,out/f.name);b=f.read_bytes();manifest[f.name]={'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest(),'originalPath':str(f.relative_to(root))}
          assert names.issubset(manifest), 'Missing exact HTTPS screenshots'
          json.dump({'role':'開發者原始HTTPS取證，非獨立QA','product':'c712bd62c7a77d812542d1138f2edd2ef0045f00','run':40658910604,'files':manifest},open(out/'manifest.json','w'),ensure_ascii=False,indent=2)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostic-evidence
          git diff --cached --quiet && exit 0
          git commit -m 'Preserve original M3.4 template-case failure, no test rerun'
          git push origin HEAD:codex/nexus-m34-evidence
