name: NEXUS quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install Chromium and OS prerequisites
        timeout-minutes: 5
        run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Repeat native selection regressions without retries
        run: npx playwright test tests/e2e/ci-regressions.spec.cjs tests/e2e/document.spec.cjs --grep 'native navigation|font, size' --repeat-each=5 --reporter=list --output=timing-stress-results
      - run: npm audit --audit-level=high
      - run: npm run build:preview
      - run: node scripts/preview-smoke.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: NEXUS-candidate-preview
          path: dist-preview/
          include-hidden-files: true
          retention-days: 30
      - name: Verify deployed Pages baseline with TLS verification
        run: node scripts/live-smoke.cjs
        env:
          NEXUS_EXPECTED_VERSION: '3.2.1'
      - name: Verify isolated candidate preview with TLS verification
        if: github.event_name == 'pull_request' && (github.head_ref == 'codex/nexus-storage-quality' || github.head_ref == 'codex/nexus-document-selection-followup')
        run: node scripts/live-smoke.cjs
        env:
          NEXUS_SITE_URL: https://lrqrll.github.io/practical-thinking-studio-preview/
          NEXUS_EXPECTED_VERSION: '3.2.1'
          NEXUS_EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha }}
      - name: Verify procurement and retirement HTTPS candidates
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/nexus-procurement-workbench'
        run: node scripts/workbench-preview-smoke.cjs
        env:
          NEXUS_EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha }}
          NEXUS_RETIRE_COMMIT: c7dd4ee180c73405f19ce5e280f33d9d4c0a08a1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
            timing-stress-results/
          retention-days: 14
