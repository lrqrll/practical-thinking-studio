name: NEXUS deployed HTTPS verification
on:
  workflow_dispatch:
  push:
    branches: [main, codex/nexus-document-selection-followup]
permissions:
  contents: read
jobs:
  deployed:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install browser
        timeout-minutes: 5
        run: npx playwright install --with-deps chromium
      - name: Read the production release target
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/expected-production-version.cjs
      - name: Verify production version and browser persistence
        run: node scripts/live-smoke.cjs
        env:
          NEXUS_EXPECTED_VERSION: ${{ env.NEXUS_EXPECTED_PRODUCTION_VERSION }}
      - name: Verify the current preview identity and browser persistence
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/current-preview-smoke.cjs
