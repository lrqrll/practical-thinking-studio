name: M2 release candidate HTTPS acceptance (developer verification)
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  release:
    if: github.head_ref == 'codex/nexus-m2-release-3.4.0' || github.ref == 'refs/heads/codex/nexus-m2-release-3.4.0'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXUS_QA_FIXTURE_REF: 59dff72bb55a77c371863d6e8a998529b1997bf0
      NEXUS_RELEASE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      NEXUS_RELEASE_SITE_URL: https://lrqrll.github.io/practical-thinking-studio-preview/m2-release/
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/qa/m2/verify-release.cjs
      - run: node scripts/qa/m2/verify-fixtures.cjs
      - name: Install actual browser with certificate verification
        timeout-minutes: 5
        run: npx playwright install --with-deps chromium
      - run: npm run build:preview
      - name: Verify 3.4.0 public preview actual bytes against this exact SHA
        run: node scripts/qa/m2/verify-release.cjs
      - name: Recheck frozen rc.2 remains byte-identical
        run: node scripts/qa/m2/verify-preview.cjs
      - run: node --max-old-space-size=4096 scripts/qa/m2/generate-large.cjs "$RUNNER_TEMP/synthetic-m2-complete"
      - name: Actual release HTTPS field removal templates immutable exports NAV document save and v1-v3 complete restore
        run: npx playwright test tests/e2e/m2-ui.spec.cjs tests/e2e/qa-fixtures.spec.cjs tests/e2e/document-save-drain.spec.cjs --workers=2 --reporter=list --trace on --output=m2-release-https-results
        env:
          NEXUS_CAPTURE_EVIDENCE: '1'
          NEXUS_M2_SITE_URL: ${{ env.NEXUS_RELEASE_SITE_URL }}
          NEXUS_M2_EXPECTED_COMMIT: ${{ env.NEXUS_RELEASE_COMMIT }}
          NEXUS_QA_SITE_URL: ${{ env.NEXUS_RELEASE_SITE_URL }}
          NEXUS_QA_LARGE_DIR: ${{ runner.temp }}/synthetic-m2-complete
      - name: Retrieve original frozen-candidate visual evidence through GitHub runner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 40177583100 --repo "$GITHUB_REPOSITORY" --name M2-synthetic-backups-and-developer-evidence --dir "$RUNNER_TEMP/frozen-evidence"
          python3 - <<'PY'
          import os,pathlib,base64,json,hashlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'frozen-evidence'
          for title in ['document-save-drain-actual','m2-ui-fixed-custom-snapsho','m2-ui-templates-are-struct','m2-ui-actual-fields-use-st']:
              paths=[p for p in root.rglob('final-screen.png') if title in str(p)]
              if len(paths)!=1: raise Exception('Missing/ambiguous original screenshot: '+title)
              p=paths[0]; b=p.read_bytes()
              encoded=base64.b64encode(b).decode()
              print('NEXUS_VISUAL_META '+json.dumps({'name':title+'.png','sha256':hashlib.sha256(b).hexdigest(),'bytes':len(b)}))
              for i in range(0,len(encoded),16000): print('NEXUS_VISUAL_CHUNK '+title+'.png '+str(i//16000)+' '+encoded[i:i+16000])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: M2-3.4.0-actual-browser-release-evidence
          path: |
            test-results/
            m2-release-https-results/
            ${{ runner.temp }}/synthetic-m2-complete/
          retention-days: 30
